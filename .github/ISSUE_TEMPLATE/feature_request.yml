name: Request a feature
description: Suggest something openDNA could do, or do better.
title: "[Feature]: "
labels: ["type: feature", "status: new"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are tracked on the public roadmap: the **status** label on each request shows where it stands
        (new, under review, planned, in progress, done, released, or declined with a reason).
        You can add a thumbs-up to a request you also want; it helps to decide the order.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what you are doing and where it is hard or impossible today, not the solution.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What behaviour would you like?
      description: How should it work, from your point of view? A sketch or a step-by-step example is ideal.
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who would this help?
      description: For example "anyone cloning with Gibson assembly", "people checking sequencing reads", "teaching labs".
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
      description: Other programs or workarounds, and why they are not enough.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include private sequences or personal information.
          required: true
