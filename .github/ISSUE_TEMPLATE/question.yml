name: Ask a question
description: You are not sure how something works in openDNA.
title: "[Question]: "
labels: ["type: question", "status: new"]
body:
  - type: markdown
    attributes:
      value: |
        Please look at the [user guide](https://github.com/OpenDNA-project/openDNA/blob/main/docs/USER_GUIDE.md) and the [tutorial](https://github.com/OpenDNA-project/openDNA/blob/main/docs/TUTORIAL.md) first.
        Do not paste private sequences.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what happened when you tried?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: openDNA version
      description: Shown in Help > About and Licence.
