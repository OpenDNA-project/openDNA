name: Report a problem
description: Something does not work, crashes, or gives a wrong result.
title: "[Bug]: "
labels: ["type: bug", "status: new"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing OpenGenEdit. The easiest way to fill this form is **Help > Report a Problem...** in the program:
        it opens this page with the version, system and recent log lines already filled in.

        **Please do not attach or paste private sequences or files.** If a file is needed to reproduce the problem, describe it
        (for example "a 5 kb circular GenBank plasmid with 12 features") or make a small example without anything confidential.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What did you see? Include the exact text of any message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from opening the program or a file.
      placeholder: |
        1. File > Open a GenBank file
        2. Select bases 100 to 200
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenGenEdit version
      description: Shown in Help > About and Licence. Filled in for you when you come from the program.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: System
      description: Windows version, and Python and Qt versions when known. Filled in for you when you come from the program.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines or error details
      description: |
        Filled in for you when you come from the program. Otherwise use Help > Open Log Folder and paste the end of
        genomeedit.log, or use Help > Copy Diagnostics and paste it here. Sequences, file names and your user name are removed
        from the log automatically.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots are welcome if they show no private sequence.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include private sequences, file names or personal information.
          required: true
