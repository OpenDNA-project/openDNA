name: release

# Builds openDNA.exe (one file) and openDNA-folder.zip (the same program as a folder, Qt replaceable) from a tag, renames them to the released
# name (project.EXE_NAME: oDNA_beta.exe, oDNA_beta-folder.zip) and attaches them to a DRAFT GitHub release. It never publishes: you read the draft, then press
# "Publish release" yourself (docs/PUBLISHING.md, section 7).
#
#   git tag v0.1.0 && git push origin v0.1.0        # the normal way
#   Actions > release > Run workflow                  # a dry run from any branch: same build, draft named after project.VERSION
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Needed to create the release and attach files; nothing else.
permissions:
  contents: write

# Two builds of the same tag would race to create the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # Cheapest check first: a tag that does not match the version in the code is a mistake, whatever the tests say.
      - name: Check the tag matches project.VERSION
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path app/project.py -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (-not $version) { throw "could not read VERSION from app/project.py" }
          "Version in the code: $version"
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -ne "v$version") {
            throw "tag $env:REF_NAME does not match project.VERSION $version (expected v$version). Delete the tag, fix the version in app/project.py, core/Cargo.toml and core/pyproject.toml, tag again."
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "VERSION=$version`n")   # UTF-8 without a byte-order mark, on any PowerShell
          $exeName = (Select-String -Path app/project.py -Pattern '^EXE_NAME\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (-not $exeName) { throw "could not read EXE_NAME from app/project.py" }
          "Released file name: $exeName.exe"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "EXE_NAME=$exeName`n")

      # Includes PyInstaller (needed for the exe) and pytest/pyflakes/biopython (the tests).
      - name: Install Python packages
        run: pip install -r requirements-dev.txt

      # `maturin develop` needs a virtualenv, which setup-python does not make: build a wheel and install it (as ci.yml does).
      - name: Build the Rust core and install it
        run: |
          maturin build --release -m core/Cargo.toml --out wheels
          pip install --no-index --find-links wheels opendna_core

      - name: Rust tests
        working-directory: core
        shell: bash
        run: PYO3_PYTHON="$(which python)" cargo test

      - name: pyflakes
        run: python -m pyflakes app tests

      - name: Python tests
        run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

      # scripts/build_exe.ps1 builds dist/openDNA.exe and dist/openDNA-folder.zip and smoke-tests both (starts it, opens demo/demo_vector.gb, checks the
      # bundled data files). A failed smoke test stops the release here.
      - name: Build openDNA.exe and the folder zip
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_exe.ps1

      # The tested files under their released name (the same bytes: only the file name changes; inside the folder zip the program keeps
      # its own name, openDNA.exe, as its README says).
      - name: Name the files for the release
        run: |
          Copy-Item dist/openDNA.exe "dist/$env:EXE_NAME.exe"
          Copy-Item dist/openDNA-folder.zip "dist/$env:EXE_NAME-folder.zip"

      # The format `sha256sum -c` reads: "<hex>  <file name>", two spaces, LF line end, no byte-order mark.
      - name: Compute the checksum
        run: |
          $exe, $zip = "$env:EXE_NAME.exe", "$env:EXE_NAME-folder.zip"
          $hash = (Get-FileHash "dist/$exe" -Algorithm SHA256).Hash.ToLower()
          $line = "$hash  $exe`n"
          [IO.File]::WriteAllText("$PWD/dist/$exe.sha256", $line)
          $zipHash = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/$zip.sha256", "$zipHash  $zip`n")
          Write-Host "$zipHash  $zip"
          Write-Host $line

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          $tag = "v$env:VERSION"
          $exe, $zip = "$env:EXE_NAME.exe", "$env:EXE_NAME-folder.zip"
          $notes = @"
          openDNA $env:VERSION. Early software: keep copies of your files.

          **Windows will warn about this file.** The exe is not code-signed, so SmartScreen shows "Windows protected your PC" (More info > Run anyway) and some antivirus programs may flag it wrongly. To check the download, compare its SHA-256 with ``$exe.sha256`` (``Get-FileHash $exe``).

          **Two downloads.** ``$exe`` is one file and the one that can update itself later. ``$zip`` is the same program as a folder, for people who want to replace the Qt libraries (see README.txt inside); it does not update itself. Each has its own ``.sha256`` file.

          Licence: AGPL-3.0. Source: this repository at tag ``$tag``.
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          # On a tag push the tag already exists; on a manual run the draft points at the commit and creates no tag until published.
          $target = if ($env:REF_TYPE -eq "tag") { @() } else { @("--target", $env:SHA) }
          # A draft of this version left by an earlier run is replaced (a published release never is: then the create below fails)
          $old = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $old -eq "true") { gh release delete $tag --yes; "Replaced the earlier draft $tag" }
          gh release create $tag "dist/$exe" "dist/$exe.sha256" "dist/$zip" "dist/$zip.sha256" --draft --title "openDNA $env:VERSION" --notes-file release-notes.md @target
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (does a release for $tag already exist?)" }
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Draft release $tag created: review it under Releases, then publish it yourself.`n")
