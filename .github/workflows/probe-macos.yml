# Temporary: which macOS runners this account can use (removed again right after).
name: probe-macos
on:
  push:
    branches: [feature/mac-linux-builds]
    paths: [.github/workflows/probe-macos.yml]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-13, macos-14-large, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: uname -a && sw_vers
